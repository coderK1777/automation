[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot-pro"
version = "0.1.0"
description = "Delta Exchange India research and paper-trading platform"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.15,<2",
    "psycopg[binary]>=3.2,<4",
    "redis>=6,<9",
    "httpx>=0.28,<1",
    "websockets>=15,<17",
    "pwdlib[argon2]>=0.2,<1",
    "python-dotenv>=1,<2",
    "pandas>=2.2,<4",
    "numpy>=2.2,<3",
    "prometheus-client>=0.21,<1",
    "cryptography>=45,<47",
    "pypdf>=5,<7",
    "tzdata>=2025.1,<2027",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[tool.setuptools.packages.find]
where = ["services/api", "packages/core", "packages/delta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["external: tests requiring explicitly enabled network services", "postgres: tests using real PostgreSQL", "mocked: controlled offline exchange fixtures; no real exchange execution"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
